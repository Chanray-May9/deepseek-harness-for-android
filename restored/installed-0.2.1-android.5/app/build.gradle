plugins { id 'com.android.application' }

// Values below are read back from the installed package:
//   aapt2 dump badging  -> package com.deepseek.harness.android, versionCode 5, 0.2.1-android.5
//   aapt2 dump xmltree  -> minSdk 28, targetSdk 28, compileSdk 35
// Dependencies are the ones the decompiled sources actually import
//   (org.apache.commons.compress.* in RuntimeInstaller).
android {
    namespace 'com.deepseek.harness.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.deepseek.harness.android'
        minSdk 28
        targetSdk 28
        versionCode 5
        versionName '0.2.1-android.5'
    }

    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging { jniLibs { useLegacyPackaging = true } }

    // The runtime archives must stay uncompressed so the app can stream them out.
    androidResources { noCompress += ['gz', 'xz'] }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            assets.srcDirs = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'commons-io:commons-io:2.16.1'
    implementation 'commons-codec:commons-codec:1.17.1'
    implementation 'org.apache.commons:commons-lang3:3.16.0'
}
